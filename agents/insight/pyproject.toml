[project]
name = "vdagent-insight"
version = "0.1.0"
description = "vdagent insight agent plugin (Insight Agent v2: deterministic pipeline, structured LLM output)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "google-genai>=1.0",
  "openai>=1.60",
]

[tool.uv.sources]
vdagent-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_insight"]

# `make insight-lint` (ruff through uvx; the repo had no linter). tools.py and mcp_client.py (legacy
# LangChain/MCP helpers) stay untouched by rule and are not imported.
[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [
  "vdagent_insight/tools.py",
  "vdagent_insight/mcp_client.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vietnamese text and typographic characters are intended
