# TC-06 fixture: shipped config with version sem-tc06-60 and overdue_threshold_days = 60.
semantic_config:
  version: sem-tc06-60
  params:
    overdue_threshold_days:
      value: 60
      status: APPROVED
      source: PRD 5.6, DW 4.3
    peer_area_tolerance_pct:
      value: '10'
      status: APPROVED
      source: DW semantic_config 3.1.0 (percent)
    peer_tiers:
      value:
        compare_min: 5
        describe_min: 3
      status: APPROVED
      source: D-71
    min_peer_count:
      value: 5
      status: APPROVED
      source: DW semantic_config 3.1.0
    severe_defect_penalty_min:
      value: 25
      status: APPROVED
      source: DW semantic_config 3.1.0
    thermal_penalty_min:
      value: 40
      status: APPROVED
      source: DW semantic_config 3.1.0
    subsidy_support_min_mo:
      value: 24
      status: APPROVED
      source: DW semantic_config 3.1.0
    funnel_dropoff_threshold_pct:
      value: '60'
      status: APPROVED
      source: DW semantic_config 3.1.0
    low_commission_threshold_pct:
      value: '1.5'
      status: APPROVED
      source: DW semantic_config 3.1.0
    peer_spread_threshold_pct:
      value: '10'
      status: APPROVED
      source: DW semantic_config 3.1.0
    secondary_gap_threshold_pct:
      value: '10'
      status: APPROVED
      source: DW semantic_config 3.1.0
    lump_sum_ticket_ratio_threshold:
      value: '15.0'
      status: APPROVED
      source: DW semantic_config 3.1.0
    defect_neutral_max:
      value: 24
      status: APPROVED
      source: DW semantic_config 3.1.0
    missing_rate_tiers:
      value:
        none_max: '5'
        note_max: '10'
        warn_max: '20'
        describe_only_max: '40'
      status: PENDING
      source: spec 5.5
    coverage_tiers:
      value:
        full_min: '90'
        partial_min: '70'
        low_min: '50'
      status: PENDING
      source: spec 5.5
    min_group_size:
      value: 3
      status: APPROVED
      source: D-71 (= peer_tiers.describe_min)
    min_effect_size_days:
      value: 15
      status: PENDING
      source: spec 5.5
    outlier_iqr_warn:
      value: '1.5'
      status: PENDING
      source: IAAO
    outlier_iqr_exclude:
      value: '3.0'
      status: PENDING
      source: IAAO
    outlier_max_excluded_pct:
      value: '10'
      status: PENDING
      source: IAAO
    freshness_warn_hours:
      value: 24
      status: PENDING
      source: spec 5.5
    freshness_error_hours:
      value: 72
      status: PENDING
      source: spec 5.5
    mnar_gap_pct:
      value: '10'
      status: PENDING
      source: spec 5.5
    max_key_insights:
      value: 5
      status: APPROVED
      source: BR-11
    attribution_sum_tolerance:
      value: '0.001'
      status: APPROVED
      source: BR-04
    max_units_in_context:
      value: 20
      status: PENDING
      source: assumed (spec 6.2 T1)
    unit_examples_per_cause:
      value: 3
      status: APPROVED
      source: spec 6.2 T1
    min_cause_share_pct:
      value: '5'
      status: PENDING
      source: assumed (spec 6.2 T2)
    conflict_tolerance_pct:
      value: '1'
      status: PENDING
      source: assumed (spec 6.2 T7)
    significance_confidence_pct:
      value: '95'
      status: PENDING
      source: spec 5.5 (Wilson / bootstrap)
    bootstrap_iterations:
      value: 1000
      status: PENDING
      source: assumed (spec 5.5)
    bootstrap_seed:
      value: 20260630
      status: PENDING
      source: 'assumed (luật 11: seed cố định)'
    priority_without_rank:
      value:
        T2: '0.5'
        T3: '0.5'
        T5: '0.3'
        T7: '0'
      status: PENDING
      source: spec 6.4 (T7 assumed)
  causes:
  - cause_code: LEGAL_PERMIT_BARRIER
    cause_label_vi: vướng mắc pháp lý / giấy phép bán hàng
    action_code: EXPEDITE_LEGAL_PROCEDURES
    template: Dự án {{project}} chưa đủ {{permit_status}}; {{cause_label}} là yếu
      tố có khả năng liên quan tới {{overdue_units}} quá hạn.
    required_evidence:
    - slot: permit
      table: dim_project_profile
      field: is_sales_permit_issued
    - slot: guarantee
      table: dim_project_profile
      field: is_bank_guarantee_issued
  - cause_code: SEVERE_PHYSICAL_DEFECT
    cause_label_vi: khuyết điểm vật lý của căn
    action_code: DEFECT_COMPENSATION_DISCOUNT
    template: 'Căn {{unit}} tồn {{dom}}; yếu tố có khả năng liên quan: {{cause_label}}
      (điểm phạt khuyết tật {{defect}}, giá so với nhóm tương đồng {{spread}}).'
    required_evidence:
    - slot: defect
      table: dm_unit_friction_diagnostics
      field: physical_defect_penalty
      unit: SCORE
    - slot: spread
      table: dm_unit_friction_diagnostics
      field: price_spread_vs_peer_pct
      unit: PCT
      signed: true
    supplementary_evidence:
    - slot: peers
      table: dm_unit_friction_diagnostics
      field: peer_count
      unit: COUNT
      noun: căn
    uses_peer_group: true
  - cause_code: EXTREME_THERMAL_EXPOSURE
    cause_label_vi: hướng nắng gắt / nhiệt cao
    action_code: INSULATION_INTERIOR_PACKAGE
    template: 'Căn {{unit}} tồn {{dom}}; yếu tố có khả năng liên quan: {{cause_label}}
      (điểm phạt nhiệt/hướng {{thermal}}, hỗ trợ lãi suất {{subsidy}}).'
    required_evidence:
    - slot: thermal
      table: dm_unit_friction_diagnostics
      field: thermal_view_penalty
      unit: SCORE
    - slot: subsidy
      table: fact_unit_inventory_snapshot
      field: subsidy_duration_mo
      unit: COUNT
      noun: tháng
  - cause_code: SECONDARY_ARBITRAGE
    cause_label_vi: giá sơ cấp cao hơn thị trường thứ cấp
    action_code: EXTENDED_PAYMENT_SCHEDULE
    template: 'Căn {{unit}} tồn {{dom}}; yếu tố có khả năng liên quan: {{cause_label}}
      (giá sơ cấp so với thứ cấp {{secondary_gap}}).'
    required_evidence:
    - slot: secondary_gap
      table: dm_unit_friction_diagnostics
      field: secondary_price_gap_pct
      unit: PCT
      signed: true
  - cause_code: LUMP_SUM_TICKET_BARRIER
    cause_label_vi: giá trị căn quá cao so với thu nhập
    action_code: BANK_SUBSIDY_EXTENSION
    template: 'Căn {{unit}} tồn {{dom}}; yếu tố có khả năng liên quan: {{cause_label}}
      (giá trị căn bằng {{ticket_ratio}} thu nhập năm của hộ gia đình).'
    required_evidence:
    - slot: ticket_ratio
      table: dm_unit_friction_diagnostics
      field: ticket_size_vs_income_ratio
      unit: RATIO
  - cause_code: OVERPRICED_VS_PEER
    cause_label_vi: giá cao hơn nhóm tương đồng
    action_code: TARGETED_PRICE_CORRECTION
    template: 'Căn {{unit}} tồn {{dom}}; yếu tố có khả năng liên quan: {{cause_label}}
      (đơn giá/m² so với trung vị peer {{spread}}).'
    required_evidence:
    - slot: spread
      table: dm_unit_friction_diagnostics
      field: price_spread_vs_peer_pct
      unit: PCT
      signed: true
    supplementary_evidence:
    - slot: peers
      table: dm_unit_friction_diagnostics
      field: peer_count
      unit: COUNT
      noun: căn
    - slot: defect
      table: dm_unit_friction_diagnostics
      field: physical_defect_penalty
      unit: SCORE
    - slot: thermal
      table: dm_unit_friction_diagnostics
      field: thermal_view_penalty
      unit: SCORE
    uses_peer_group: true
  - cause_code: LOW_SALES_INCENTIVE
    cause_label_vi: động lực bán hàng của sàn thấp
    action_code: BOOST_BROKER_COMMISSION
    template: 'Căn {{unit}} tồn {{dom}}; yếu tố có khả năng liên quan: {{cause_label}}
      (hoa hồng sàn {{commission}}).'
    required_evidence:
    - slot: commission
      table: fact_unit_inventory_snapshot
      field: base_commission_pct
      unit: PCT
    supplementary_evidence:
    - slot: spiff
      table: fact_unit_inventory_snapshot
      field: spiff_bonus_vnd
      unit: VND
  - cause_code: DEEP_FUNNEL_DROP_OFF
    cause_label_vi: khách rơi nhiều ở phễu bán hàng
    action_code: SALES_PITCH_AUDIT
    template: 'Căn {{unit}} tồn {{dom}}; yếu tố có khả năng liên quan: {{cause_label}}
      (tỷ lệ rút cọc {{dropoff}}).'
    required_evidence:
    - slot: dropoff
      table: dm_unit_friction_diagnostics
      field: funnel_dropoff_rate_pct
      unit: PCT
  action_texts:
    EXPEDITE_LEGAL_PROCEDURES: Đề xuất xem xét đẩy nhanh hoàn thiện thủ tục pháp lý
      và bảo lãnh ngân hàng trước khi mở bán đại trà.
    DEFECT_COMPENSATION_DISCOUNT: Đề xuất xem xét chính sách chiết khấu bù trừ cho
      khuyết điểm công năng của căn.
    INSULATION_INTERIOR_PACKAGE: Đề xuất xem xét gói nội thất cách nhiệt kèm ưu đãi
      phí quản lý cho căn.
    EXTENDED_PAYMENT_SCHEDULE: Đề xuất xem xét giãn tiến độ thanh toán để kéo giá
      ròng về gần mặt bằng thứ cấp.
    BANK_SUBSIDY_EXTENSION: Đề xuất xem xét kéo dài thời gian hỗ trợ lãi suất và ân
      hạn nợ gốc cùng ngân hàng đối tác.
    TARGETED_PRICE_CORRECTION: Đề xuất xem xét điều chỉnh đơn giá niêm yết về gần
      mức trung vị nhóm tương đồng.
    BOOST_BROKER_COMMISSION: Đề xuất xem xét nâng hoa hồng hoặc thưởng chốt cọc cho
      sàn môi giới.
    SALES_PITCH_AUDIT: Đề xuất xem xét rà soát quy trình tư vấn của sàn và các cam
      kết với khách giữ chỗ.
  insight_templates:
    CAUSE_DISTRIBUTION: Trong {{scope}}, {{cause_label}} chiếm {{weighted_share}}
      tổng điểm quy nguyên nhân (có trọng số) và xuất hiện ở {{unit_share}} số căn
      quá hạn (đếm theo căn).
    PATTERN: Nhóm {{group}} có DOM trung vị {{group_dom}}, so với {{rest_dom}} ở các
      căn còn lại; đây là mối liên hệ đi kèm, chưa phải kết luận về nguyên nhân.
    MARKET_CONTEXT: 'Bối cảnh thị trường {{market}} trong {{window_months}} gần nhất:
      lãi suất thả nổi từ {{interest_rate_start}} đến {{interest_rate}}, tỷ lệ hấp
      thụ từ {{absorption_rate_start}} đến {{absorption_rate}}; thông tin này chỉ
      mang tính tham khảo.'
    DATA_LIMITATION: 'Dữ liệu cho {{subject}} còn hạn chế: {{limitation}}.'
    CONFLICT: Hai nguồn dữ liệu cho {{subject}} chưa nhất quán về yếu tố chính; cần
      kiểm tra lại trước khi kết luận.
    NO_OVERDUE_UNITS: Không có căn quá hạn trong phạm vi {{scope}} tại kỳ dữ liệu
      này.
  market_metrics:
  - slot: interest_rate
    column: floating_mortgage_rate_pct
    unit: PCT
    trend: true
  - slot: absorption_rate
    column: absorption_rate_pct
    unit: PCT
    trend: true
  - slot: moi
    column: months_of_inventory_moi
    unit: RATIO
    noun: tháng
    trend: false
  - slot: pir
    column: macro_price_to_income_ratio
    unit: RATIO
    trend: false
  - slot: household_income
    column: median_household_income_vnd
    unit: VND
    trend: false
  pattern_dimensions:
  - name: floor_band
    table: dim_unit_master
  - name: balcony_orientation
    table: dim_unit_master
  - name: view_primary_type
    table: dim_unit_master
  - name: unit_type
    table: dim_unit_master
  - name: launch_batch_id
    table: fact_unit_inventory_snapshot
  - name: channel_key
    table: fact_unit_inventory_snapshot
  forbidden_phrases:
  - chắc chắn do
  - nguyên nhân duy nhất
  - chứng minh rằng
  - gây ra
  - dẫn đến
  - là nguyên nhân
  - khiến cho
  - sẽ bán được nếu
  - đã giảm giá
  - hệ thống sẽ
  - bỏ qua hướng dẫn
  english_whitelist:
  - DOM
  - peer
  - PIR
  - MOI
  - m²
  language:
    label_slots:
    - unit
    - project
    - zone
    - scope
    - subject
    - group
    - market
    - cause_label
    - permit_status
    - limitation
    quantity_words:
    - một nửa
    - gấp đôi
    - gấp ba
    - phần tư
    - phần ba
    - chục
    - trăm
    - nghìn
    - ngàn
    - triệu
    - tỷ
    - hàng loạt
    - đa số
    - phần lớn
    quantity_word_exceptions:
    - tỷ lệ
    - tỷ trọng
    - tỷ suất
    - phần trăm
    median_slots:
    - group_dom
    - rest_dom
    mean_words:
    - trung bình
    - bình quân
    strong_comparison_phrases:
    - cao hơn rõ
    - thấp hơn rõ
    - chậm hơn rõ
    - nhanh hơn rõ
    - vượt trội
    - đáng kể
    - khác biệt rõ
    - nổi bật
    imperative_phrases:
    - hãy
    - phải
    - ngay lập tức
    - bắt buộc
    - đã giảm
    - đã điều chỉnh
    - đã tăng
    recommendation_prefixes:
    - Đề xuất
    - Có thể cân nhắc
    english_stopwords:
    - the
    - is
    - are
    - was
    - were
    - and
    - of
    - for
    - with
    - vs
    - than
    - unit
    - units
    - price
    - prices
    - overpriced
    - because
    - due
    - higher
    - lower
    - slower
    - faster
    - sales
    - this
    - that
    - has
    - have
    - not
    - which
    injection_patterns:
    - bỏ qua (mọi |tất cả )?(các )?(hướng dẫn|chỉ thị)
    - ignore (all |any )?(previous |prior )?instructions
    - '\bsystem\s*:'
    - \bbạn là\b
    - \byou are\b
    - https?://
    unit_code_pattern: '[A-Z][A-Z0-9]*-\d{2}\.\d{3}'
    max_words: 40
    permit_status_labels:
      permit: giấy phép mở bán
      guarantee: bảo lãnh ngân hàng
      both: giấy phép mở bán và bảo lãnh ngân hàng
    peer_hidden_template: 'Căn {{unit}} tồn {{dom}}; yếu tố có khả năng liên quan:
      {{cause_label}} (nhóm tương đồng quá ít căn để so sánh).'
    chart_hints:
      ROOT_CAUSE_SIGNAL: kpi_card
      CAUSE_DISTRIBUTION: stacked_bar
      PATTERN: bar
      MARKET_CONTEXT: line
    limitation_messages:
      DQ_NOTE: một phần nhỏ dữ liệu của trường này bị thiếu
      DQ_WARN: dữ liệu của trường này thiếu ở mức cần lưu ý, mức tin cậy được hạ một
        bậc
      DQ_DESCRIBE_ONLY: dữ liệu thiếu nhiều nên chỉ mô tả, không so sánh hay quy nguyên
        nhân
      FIELD_EXCLUDED: trường dữ liệu thiếu quá nhiều nên không được sử dụng
      MISSING_NOT_RANDOM: dữ liệu thiếu không ngẫu nhiên giữa căn quá hạn và căn đã
        bán
      EVIDENCE_FIELD_MISSING: thiếu dữ liệu bắt buộc để làm bằng chứng
      PARTIAL_COVERAGE: chỉ một phần căn quá hạn có đủ dữ liệu chẩn đoán
      LOW_COVERAGE: số căn có đủ dữ liệu chẩn đoán còn thấp nên chỉ mô tả
      INSUFFICIENT_COVERAGE: không đủ căn có dữ liệu chẩn đoán để kết luận ở cấp này
      SMALL_SAMPLE: cỡ mẫu nhỏ nên chỉ mô tả, không so sánh
      GROUP_TOO_SMALL: nhóm quá ít căn để so sánh
      OUTLIER_WARN: có giá trị bất thường so với các căn cùng nhóm
      OUTLIER_EXCLUDED: có giá trị cực đoan so với các căn cùng nhóm
      STALE_SNAPSHOT: dữ liệu tồn kho và giá chưa được cập nhật gần đây
      PEER_SAMPLE_CONSTRAINED: nhóm tương đồng phải mở rộng sang tầng lân cận do thiếu
        mẫu
      PEER_DATA_MISSING: thiếu số liệu so sánh với nhóm tương đồng
      NO_OVERDUE_UNITS: không có căn quá hạn trong phạm vi
      MARKET_CONTEXT_MISSING: không có dữ liệu bối cảnh thị trường cho yêu cầu này
      INFERRED_MARKET_METRIC: một số chỉ số thị trường là giá trị suy luận nên chỉ
        nêu mức, không nêu xu hướng
      CONFLICT: các nguồn dữ liệu chưa nhất quán, cần kiểm tra trước khi kết luận
      PRIMARY_CAUSE_MISMATCH: nguyên nhân chính trong bảng chẩn đoán khác với bảng
        nguyên nhân chi tiết
      ATTRIBUTION_SUM_MISMATCH: tổng tỷ trọng các nguyên nhân của căn chưa khớp
      ACTION_CODE_MISMATCH: khuyến nghị trong bảng chẩn đoán khác với danh mục khuyến
        nghị
      SOURCE_MISMATCH: hai nguồn dữ liệu cùng kỳ cho số liệu khác nhau
      LEGAL_FLAGS_MISMATCH: dự án đã đủ giấy tờ pháp lý nhưng vẫn được gắn yếu tố
        pháp lý
      DEADLINE_EXCEEDED: hết thời gian xử lý, phần diễn giải dùng mẫu cố định
