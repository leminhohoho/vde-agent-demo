# Insight Agent semantic_config (spec §5.4, §7.6, §8.2). Loaded and validated by settings.py.
#
# - `version` must equal the request's `semantic_config_version` (a new version = a new file
#   `semantic_insight.<version>.yaml` next to this one; old versions stay for replay).
# - Every param has `status`: APPROVED (chốt) or PENDING (mặc định tạm, Sales Ops / DA xác nhận sau).
# - Decimals are QUOTED strings ("0.10"): a YAML float is rejected by the loader (luật 3).
# - Templates: numbers only through {{slot}}; cause names only through {{cause_label}} (GR-01, GR-08).
#
# Keys marked "assumed" are used by the spec but missing from table 5.4; their defaults are ours
# (docs/OPEN_QUESTIONS.md Q8e).

semantic_config:
  version: "sem-2026-09-29"

  params:
    overdue_threshold_days: {value: 90, status: APPROVED, source: "PRD 5.6, DW 4.3"}
    peer_area_tolerance_pct: {value: "0.10", status: APPROVED, source: "PRD 5.6"}
    peer_tiers: {value: {compare_min: 10, describe_min: 5}, status: PENDING, source: "spec 5.5"}
    physical_defect_trigger: {value: 25, status: APPROVED, source: "DW 4.3"}
    thermal_penalty_trigger: {value: 40, status: APPROVED, source: "DW 4.3"}
    subsidy_min_months: {value: 24, status: APPROVED, source: "DW 4.3"}
    funnel_dropoff_trigger_pct: {value: "60", status: APPROVED, source: "DW 4.3"}
    low_commission_max_pct: {value: "1.5", status: APPROVED, source: "DW 4.3"}
    # missing_rate of a secondary field, upper bounds in %: note ≤5, warn ≤10, describe-only ≤20,
    # exclude above 40 (20–40 → DQ_DESCRIBE_ONLY).
    missing_rate_tiers: {value: {note_max: "5", warn_max: "10", describe_only_min: "20", exclude_above: "40"}, status: PENDING, source: "spec 5.5"}
    # coverage lower bounds in %: ≥90 full, 70–90 partial, 50–70 low, <50 insufficient.
    coverage_tiers: {value: {full_min: "90", partial_min: "70", low_min: "50"}, status: PENDING, source: "spec 5.5"}
    min_group_size: {value: 5, status: PENDING, source: "spec 5.5"}
    min_effect_size_days: {value: 15, status: PENDING, source: "spec 5.5"}
    outlier_iqr_warn: {value: "1.5", status: PENDING, source: "IAAO"}
    outlier_iqr_exclude: {value: "3.0", status: PENDING, source: "IAAO"}
    outlier_max_excluded_pct: {value: "10", status: PENDING, source: "IAAO"}
    freshness_warn_hours: {value: 24, status: PENDING, source: "spec 5.5"}
    freshness_error_hours: {value: 72, status: PENDING, source: "spec 5.5"}
    mnar_gap_pct: {value: "10", status: PENDING, source: "spec 5.5"}
    max_key_insights: {value: 5, status: APPROVED, source: "BR-11"}
    attribution_sum_tolerance: {value: "0.001", status: APPROVED, source: "BR-04"}
    max_units_in_context: {value: 20, status: PENDING, source: "assumed (spec 6.2 T1)"}
    min_cause_share_pct: {value: "5", status: PENDING, source: "assumed (spec 6.2 T2)"}
    conflict_tolerance_pct: {value: "1", status: PENDING, source: "assumed (spec 6.2 T7)"}
    significance_confidence_pct: {value: "95", status: PENDING, source: "spec 5.5 (Wilson / bootstrap)"}
    bootstrap_iterations: {value: 1000, status: PENDING, source: "assumed (spec 5.5)"}
    bootstrap_seed: {value: 20260630, status: PENDING, source: "assumed (luật 11: seed cố định)"}

  # Spec 7.6. action_code follows DW 4.3; recommendation_text is our draft (Sales Ops to review).
  causes:
    - cause_code: LEGAL_PERMIT_BARRIER
      cause_label_vi: "vướng mắc pháp lý / giấy phép bán hàng"
      action_code: EXPEDITE_LEGAL_PROCEDURES
      template: "Dự án {{project}} chưa đủ {{permit_status}}; đây là yếu tố có khả năng liên quan tới {{overdue_units}} căn quá hạn."
      recommendation_text: "Đề xuất xem xét đẩy nhanh hoàn thiện thủ tục pháp lý và bảo lãnh ngân hàng trước khi mở bán đại trà."
    - cause_code: SEVERE_PHYSICAL_DEFECT
      cause_label_vi: "khuyết điểm vật lý của căn"
      action_code: DEFECT_COMPENSATION_DISCOUNT
      template: "Căn {{unit}} tồn {{dom}}; điểm phạt khuyết tật {{defect}}."
      recommendation_text: "Đề xuất xem xét chính sách chiết khấu bù trừ cho khuyết điểm công năng của căn."
    - cause_code: EXTREME_THERMAL_EXPOSURE
      cause_label_vi: "hướng nắng gắt / nhiệt cao"
      action_code: INSULATION_INTERIOR_PACKAGE
      template: "Căn {{unit}} tồn {{dom}}; điểm phạt nhiệt/hướng {{thermal}}."
      recommendation_text: "Đề xuất xem xét gói nội thất cách nhiệt kèm ưu đãi phí quản lý cho căn."
    - cause_code: SECONDARY_ARBITRAGE
      cause_label_vi: "giá sơ cấp cao hơn thị trường thứ cấp"
      action_code: EXTENDED_PAYMENT_SCHEDULE
      template: "Căn {{unit}} tồn {{dom}}; giá sơ cấp cao hơn thứ cấp {{secondary_gap}}."
      recommendation_text: "Đề xuất xem xét giãn tiến độ thanh toán để kéo giá ròng về gần mặt bằng thứ cấp."
    - cause_code: LUMP_SUM_TICKET_BARRIER
      cause_label_vi: "giá trị căn quá cao so với thu nhập"
      action_code: BANK_SUBSIDY_EXTENSION
      template: "Căn {{unit}} tồn {{dom}}; giá trị căn gấp {{ticket_ratio}} lần thu nhập năm."
      recommendation_text: "Đề xuất xem xét kéo dài thời gian hỗ trợ lãi suất và ân hạn nợ gốc cùng ngân hàng đối tác."
    - cause_code: OVERPRICED_VS_PEER
      cause_label_vi: "giá cao hơn nhóm tương đồng"
      action_code: TARGETED_PRICE_CORRECTION
      template: "Căn {{unit}} tồn {{dom}}; đơn giá/m² cao hơn trung vị peer {{spread}}."
      recommendation_text: "Đề xuất xem xét điều chỉnh đơn giá niêm yết về gần mức trung vị nhóm tương đồng."
    - cause_code: LOW_SALES_INCENTIVE
      cause_label_vi: "động lực bán hàng của sàn thấp"
      action_code: BOOST_BROKER_COMMISSION
      template: "Căn {{unit}} tồn {{dom}}; hoa hồng sàn {{commission}}."
      recommendation_text: "Đề xuất xem xét nâng hoa hồng hoặc thưởng chốt cọc cho sàn môi giới."
    - cause_code: DEEP_FUNNEL_DROP_OFF
      cause_label_vi: "khách rơi nhiều ở phễu bán hàng"
      action_code: SALES_PITCH_AUDIT
      template: "Căn {{unit}} tồn {{dom}}; tỷ lệ rơi phễu {{dropoff}}."
      recommendation_text: "Đề xuất xem xét rà soát quy trình tư vấn của sàn và các cam kết với khách giữ chỗ."

  # TEMPLATE fallback per insight_type (spec 8.2). ROOT_CAUSE_SIGNAL uses the per-cause template.
  # Drafts written for Phase 0 (assumed): Sales Ops to review the wording.
  insight_templates:
    CAUSE_DISTRIBUTION: "Trong {{scope}}, {{cause_label}} chiếm {{weighted_share}} tổng điểm quy nguyên nhân (có trọng số) và xuất hiện ở {{unit_share}} số căn quá hạn (đếm theo căn)."
    PATTERN: "Nhóm {{group}} có DOM trung vị {{group_dom}}, so với {{rest_dom}} ở các căn còn lại; đây là mối liên hệ đi kèm, chưa phải kết luận về nguyên nhân."
    MARKET_CONTEXT: "Bối cảnh thị trường {{market}}: lãi suất {{interest_rate}}, tỷ lệ hấp thụ {{absorption_rate}}; thông tin này chỉ mang tính tham khảo."
    DATA_LIMITATION: "Dữ liệu cho {{subject}} còn hạn chế: {{limitation}}."
    CONFLICT: "Hai nguồn dữ liệu cho {{subject}} chưa nhất quán về yếu tố chính; cần kiểm tra lại trước khi kết luận."
    NO_OVERDUE_UNITS: "Không có căn quá hạn trong phạm vi {{scope}} tại kỳ dữ liệu này."

  # GR-02 / GR-06, matched after Unicode NFC + lowercase. URLs are rejected by the validator itself.
  forbidden_phrases:
    - "chắc chắn do"
    - "nguyên nhân duy nhất"
    - "chứng minh rằng"
    - "gây ra"
    - "dẫn đến"
    - "là nguyên nhân"
    - "khiến cho"
    - "sẽ bán được nếu"
    - "đã giảm giá"
    - "hệ thống sẽ"
    - "bỏ qua hướng dẫn"

  # GR-08: English words allowed in Vietnamese sentences.
  english_whitelist: ["DOM", "peer", "PIR", "MOI", "m²"]
