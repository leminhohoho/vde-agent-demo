[project]
name = "vdagent-backend"
version = "0.1.0"
description = "vdagent Backend: FastAPI REST/SSE, invocation engine, MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-proto",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "grpcio>=1.66",
  "python-dotenv>=1.0",
  "mcp>=1.9",
  "pyyaml>=6",
]

[tool.uv.sources]
vdagent-proto = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_backend"]
