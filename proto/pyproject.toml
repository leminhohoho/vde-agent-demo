[project]
name = "vdagent-proto"
version = "0.1.0"
description = "vdagent gRPC protocol stubs (generated by scripts/gen.py)"
requires-python = ">=3.12,<3.13"
dependencies = ["grpcio>=1.66", "protobuf>=5.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_proto"]
