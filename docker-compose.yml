# vdagent PoC (spec §12). `docker compose up --build`, then open http://localhost:8000.
# `.env` in the repo root holds the Backend's agent tokens (VDAGENT_AGENT_TOKEN_<NAME>); each
# `agents/<name>/.env` holds that agent's token and LLM settings (OPENAI_API_KEY, OPENAI_BASE_URL,
# LLM_MODEL). Agents dial the backend's hub at backend:50050 (`environment` wins over `env_file`).

x-python: &python
  build:
    context: .
    dockerfile: Dockerfile.python
  image: vdagent-python:latest
  volumes:
    - ./var:/app/var

x-agent: &agent
  <<: *python
  environment:
    VDAGENT_BACKEND: backend:50050
  depends_on:
    - backend
  restart: unless-stopped

services:
  seed:
    <<: *python
    command: ["sh", "-c", "python data/seed_warehouse.py && python data/seed_users.py"]
    environment:
      VDAGENT_CONFIG: /app/backend/config.compose.yaml
    restart: "no"

  backend:
    <<: *python
    command: ["uvicorn", "vdagent_backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      VDAGENT_CONFIG: /app/backend/config.compose.yaml
    ports:
      - "8000:8000"
    expose:
      - "50050"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  orchestrator:
    <<: *agent
    command: ["python", "-m", "vdagent_orchestrator"]
    env_file: agents/orchestrator/.env

  data:
    <<: *agent
    command: ["python", "-m", "vdagent_data"]
    env_file: agents/data/.env

  compare:
    <<: *agent
    command: ["python", "-m", "vdagent_compare"]
    env_file: agents/compare/.env

  insight:
    <<: *agent
    command: ["python", "-m", "vdagent_insight"]
    env_file: agents/insight/.env

  report:
    <<: *agent
    command: ["python", "-m", "vdagent_report"]
    env_file: agents/report/.env
