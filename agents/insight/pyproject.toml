[project]
name = "vdagent-insight"
version = "0.1.0"
description = "vdagent insight agent plugin (LangChain agent with memory)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "python-dotenv>=1.0",
  "langchain>=1.4",
  "langchain-openai>=1.6",
  "mcp>=1.9",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[tool.uv.sources]
vdagent-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_insight"]
