[project]
name = "vdagent-agent-template"
version = "0.1.0"
description = "vdagent agent template: copy this folder to build an agent (see README.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-proto",
  "grpcio>=1.66",
  "python-dotenv>=1.0",
]

[tool.uv.sources]
vdagent-proto = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_template"]
