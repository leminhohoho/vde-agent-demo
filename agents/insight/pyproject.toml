[project]
name = "vdagent-insight"
version = "0.1.0"
description = "vdagent insight agent plugin (LangChain agent with memory)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "python-dotenv>=1.0",
  "langchain>=1.4",
  "langchain-openai>=1.6",
  "mcp>=1.9",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[tool.uv.sources]
vdagent-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_insight"]

# `make insight-lint` (ruff through uvx; the repo had no linter). The legacy LangChain modules are
# excluded until phase P4 replaces them; tools.py and mcp_client.py stay untouched by rule.
[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [
  "vdagent_insight/agent.py",
  "vdagent_insight/bridge.py",
  "vdagent_insight/tools.py",
  "vdagent_insight/mcp_client.py",
  "vdagent_insight/tests/test_agent.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vietnamese text and typographic characters are intended
